// RecallVault - Gradle build (v0.2.0+). Single-module layout: the
// Android sources live at the project root (java/, res/, assets/,
// AndroidManifest.xml) exactly as the v0.1.0 no-Gradle pipeline used
// them; sourceSets below point AGP at that layout, nothing moved.
//
// Versions pinned from live metadata, Oct 31, 2026:
//  - AGP 9.4.1: proven on this machine with Gradle 9.7.1 + JDK 25
//    (Loot Dungeon / Moonbrew builds); 9.5.0 exists but is unproven here.
//  - ML Kit text-recognition 16.0.1: <latest> in Google Maven metadata.
//  - PdfBox-Android 2.0.27.0: <latest> in Maven Central metadata.
plugins {
    id 'com.android.application' version '9.4.1'
}

// Release signing (v0.78.0): the real release keystore lives
// OUTSIDE this repo in ~/Projects/recallvault-signing/ with a
// 0600 keystore.properties (paths + passwords). When that file
// is absent (a fresh clone), release falls back to the house
// debug key so the project still builds - but such an APK is
// NOT the shippable one and must never be distributed.
def releaseProps = new Properties()
def releasePropsFile = file("${System.getProperty('user.home')}/Projects/recallvault-signing/keystore.properties")
if (releasePropsFile.exists()) {
    releaseProps.load(new FileInputStream(releasePropsFile))
}

android {
    namespace 'com.irwinlabs.recallvault'
    compileSdk 36

    defaultConfig {
        applicationId 'com.irwinlabs.recallvault'
        minSdk 26
        targetSdk 35
        versionCode 96
        versionName '0.79.0'
        multiDexEnabled true
    }

    signingConfigs {
        house {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        releaseReal {
            if (releasePropsFile.exists()) {
                storeFile file(releaseProps['storeFile'])
                storePassword releaseProps['storePassword']
                keyAlias releaseProps['keyAlias']
                keyPassword releaseProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.house
        }
        release {
            minifyEnabled false
            signingConfig(releasePropsFile.exists()
                ? signingConfigs.releaseReal : signingConfigs.house)
        }
    }

    // v0.8.0: ship an arm64-only APK. The 213 MB universal build was
    // almost all native libraries for chips this phone does not have
    // (LiteRT-LM/MediaPipe ship every ABI); the app's own .so is
    // arm64-only already. universalApk off: one APK, the right one.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    // v0.56.0: the two JavaMail jars both ship the same
    // META-INF notices - keep one copy.
    packaging {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            // librecallwhisper.so (whisper.cpp JNI, built by native/build.sh).
            jniLibs.srcDirs = ['jniLibs']
        }
    }
}

dependencies {
    // Email (v0.56.0): JavaMail for Android - IMAP/SMTP with
    // app passwords. Pinned; artifacts verified on Maven Central.
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // QR pairing (v0.79.0): ML Kit barcode scanning (17.3.0 =
    // <latest> in Google Maven metadata, Nov 3, 2026) over a
    // CameraX preview. CameraX pinned at 1.5.3, the stable
    // line verified against this project's compileSdk 36 /
    // androidx.core 1.17 pins (1.6.x wants newer core).
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.camera:camera-core:1.5.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // v0.3.0 additions, pinned from live Google Maven metadata (Oct 31, 2026):
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'androidx.core:core:1.17.0'
    // On-device EmbeddingGemma 2 (Universal Embedder over LiteRT-LM).
    implementation 'com.google.mediapipe:tasks-retrieval:1.2.0'
    // Watch capture (v0.18.0): Data Layer messages from the Galaxy Watch app.
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
}

// androidx.core 1.19.x demands compileSdk 37; this project compiles
// against 36, so hold core at the last 36-compatible line.
// tasks-retrieval 1.2.0's POM pins litertlm-android 0.17.0-alpha1, but
// that AAR does NOT contain com.google.ai.edge.litertlm.ActivationDataType,
// which UniversalEmbedder references - the app crash-looped on device
// (NoClassDefFoundError) until this force was added. Verified by
// inspecting the AARs: the class first appears in 0.18.0 (Oct 31, 2026).
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.17.0', 'androidx.core:core-ktx:1.17.0'
        force 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
    }
}
